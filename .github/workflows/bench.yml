name: Benchmark

on:
  push:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bench.yml"
    branches:
      - "**"
  pull_request:

jobs:
  bench:
    name: Bench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Cache cargo registry, index, and targets
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "cargo-bench"
          add-job-id-key: false
      - name: Checkout domain-list-community repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: v2fly/domain-list-community
          fetch-depth: 1
          path: dlc/
      - name: Run benchmarks
        run: |
          echo -e "### Benchmark results\n" '```console' >> $GITHUB_STEP_SUMMARY
          DATASET=dlc/data cargo bench --bench pipeline --no-default-features --features rustc-hash \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash
